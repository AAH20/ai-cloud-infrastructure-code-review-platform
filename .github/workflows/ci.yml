name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: cloud-review-platform examples/safe-change.json --output safe-evidence.json --fail-on-block
      - run: cloud-review-platform examples/risky-change.json --output risky-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: reference-evidence
          path: "*-evidence.json"

